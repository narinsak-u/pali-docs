[project]
name = "pali-docs-api"
version = "0.1.0"
description = "FastAPI service boundary for Pali Docs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "PyYAML>=6.0,<7",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.6,<1",
  "pinecone>=6,<8",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
