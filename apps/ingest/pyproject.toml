[project]
name = "pali-docs-ingest"
version = "0.1.0"
description = "Pali Docs ingestion package boundary"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "pinecone>=6,<8"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
